[package]
name = "yes-sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
gpui-kit.workspace = true
gpui-wry.workspace = true
raw-window-handle.workspace = true
rust-embed.workspace = true
serde_json.workspace = true
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }
two-face = { version = "0.5.1", default-features = false, features = ["syntect-fancy"] }
wry.workspace = true
yes-core = { path = "../yes-core" }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView", "NSEvent", "NSResponder", "NSWindow", "block2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.3", features = ["test-support"] }

[[bin]]
name = "yes-sessions"
path = "src/main.rs"
test = false
