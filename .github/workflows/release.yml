name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (for example v10.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable release tag: vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.value }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Select distribution signing
        id: signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is required" >&2
            exit 1
          fi
          configured=0
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD CODESIGN_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [ -n "${!name}" ]; then configured=$((configured + 1)); fi
          done
          if [ "$configured" -eq 0 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "notice=Ad-hoc signed, without Apple notarization. On first launch, open System Settings > Privacy & Security > Open Anyway." >> "$GITHUB_OUTPUT"
          elif [ "$configured" -eq 6 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "notice=Signed with Developer ID, notarized by Apple, and stapled for Gatekeeper validation." >> "$GITHUB_OUTPUT"
          else
            echo "Configure all six Apple signing secrets, or leave all six unset for ad-hoc distribution" >&2
            exit 1
          fi

      - name: Install Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/yes-sessions-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/yes-sessions-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$MACOS_CERTIFICATE" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"

      - name: Verify version
        id: version
        run: |
          TAG_VERSION="${{ steps.tag.outputs.value }}"
          TAG_VERSION="${TAG_VERSION#v}"
          CARGO_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test "$TAG_VERSION" = "$CARGO_VERSION"
          echo "value=$CARGO_VERSION" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          cargo fmt --all --check
          cargo check --workspace --locked
          cargo test --workspace --locked

      - name: Build app and DMG
        run: ./scripts/package-macos.sh
        env:
          CARGO_BUILD_TARGET: aarch64-apple-darwin
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

      - name: Calculate SHA256
        id: sha
        run: |
          DMG="release/Yes-Sessions-${{ steps.version.outputs.value }}-arm64.dmg"
          echo "value=$(shasum -a 256 "$DMG" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          files: release/Yes-Sessions-${{ steps.version.outputs.value }}-arm64.dmg
          generate_release_notes: true
          body: |
            macOS 13+ / Apple Silicon

            SHA256: `${{ steps.sha.outputs.value }}`

            ${{ steps.signing.outputs.notice }}

      - name: Publish artifact to Homebrew tap release
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          DMG="release/Yes-Sessions-${VERSION}-arm64.dmg"
          if gh release view "v${VERSION}" --repo KrabsWong/homebrew-yes-sessions >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "$DMG" --repo KrabsWong/homebrew-yes-sessions --clobber
          else
            gh release create "v${VERSION}" "$DMG" \
              --repo KrabsWong/homebrew-yes-sessions \
              --title "v${VERSION}" \
              --generate-notes
          fi

      - name: Update Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
          SHA256: ${{ steps.sha.outputs.value }}
        run: |
          gh auth setup-git
          gh repo clone KrabsWong/homebrew-yes-sessions homebrew-tap -- --branch main
          python3 scripts/render-homebrew-cask.py "$VERSION" "$SHA256" homebrew-tap/Casks/yes-sessions.rb
          cp packaging/homebrew-README.md homebrew-tap/README.md
          ruby -c homebrew-tap/Casks/yes-sessions.rb
          cd homebrew-tap
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Casks/yes-sessions.rb README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update yes-sessions to ${VERSION}" -m "Publish the Rust/GPUI Apple Silicon package and refresh its checksum."
          git push origin main

      - name: Remove temporary signing keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: security delete-keychain "$RUNNER_TEMP/yes-sessions-signing.keychain-db" || true
