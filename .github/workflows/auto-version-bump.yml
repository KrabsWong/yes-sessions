name: Auto Version Bump

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  bump-version:
    if: >-
      github.event.pull_request.merged == true &&
      !contains(github.event.pull_request.labels.*.name, 'skip-release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require workflow token
        env:
          WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
        run: |
          if [ -z "$WORKFLOW_PAT" ]; then
            echo "WORKFLOW_PAT is required so the pushed tag can trigger the Release workflow" >&2
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_PAT }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Select bump type
        id: bump
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          TYPE=patch
          if [[ "$LABELS" == *'"major"'* ]]; then
            TYPE=major
          elif [[ "$LABELS" == *'"minor"'* ]]; then
            TYPE=minor
          fi
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"

      - name: Update Cargo version
        id: version
        env:
          BUMP_TYPE: ${{ steps.bump.outputs.type }}
        run: |
          CURRENT="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          # A version deliberately prepared on the PR (such as 10.0.0) is
          # released as-is. Only increment an already-tagged version.
          if ! git rev-parse --verify "refs/tags/v$CURRENT" >/dev/null 2>&1; then
            echo "value=$CURRENT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CORE="${CURRENT%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CORE"
          case "$BUMP_TYPE" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEXT="$MAJOR.$MINOR.$PATCH"
          sed "s/^version = \"$CURRENT\"/version = \"$NEXT\"/" Cargo.toml > Cargo.toml.tmp
          mv Cargo.toml.tmp Cargo.toml
          cargo update --workspace
          echo "value=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Cargo.toml Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bump version to $VERSION" -m "Update the Rust workspace and lockfile versions after merging the release PR."
          fi
          git tag "v$VERSION"
          git push --atomic origin HEAD:main "refs/tags/v$VERSION"
