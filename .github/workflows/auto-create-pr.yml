name: Auto Create PR

on:
  push:
    branches:
      - '**'
      - '!main'

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if PR already exists
        id: check-pr
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::WORKFLOW_PAT is required to create PRs with automatic workflow execution."
            exit 1
          fi
          EXISTING=$(gh pr list --head "$BRANCH" --base main --json number --jq '.[0].number')

          if [ -n "$EXISTING" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "pr_number=$EXISTING" >> $GITHUB_OUTPUT
            echo "✅ PR #$EXISTING 已存在，跳过创建"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "📝 未找到已有 PR，准备创建"
          fi

      - name: Create PR
        if: steps.check-pr.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          BRANCH: ${{ github.ref_name }}
        run: |
          TITLE=$(git log -1 --pretty=format:"%s")
          BODY=$(git log -1 --pretty=format:"%b")
          BODY_FILE=$(mktemp)
          trap 'rm -f "$BODY_FILE"' EXIT

          printf '%s\n\n---\n_此 PR 由 GitHub Actions 自动创建。_\n\n**合并前请添加版本标签（必选其一）：**\n- `major` — 重大版本升级\n- `minor` — 新功能\n- `patch` — 问题修复\n- `skip-release` — 无需发版（文档、配置等无关紧要的改动）_' "$BODY" > "$BODY_FILE"

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body-file "$BODY_FILE")

          echo "✅ PR 已创建: $PR_URL"
