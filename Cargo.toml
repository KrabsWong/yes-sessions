[workspace]
members = ["crates/yes-core", "crates/yes-app"]
resolver = "2"

[workspace.package]
version = "10.0.0"
edition = "2024"
license = "MIT"
authors = ["Yes, Sessions Team"]

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
gpui-kit = { version = "=0.6.0" }
gpui-wry = { version = "=0.6.0" }
notify = "8"
raw-window-handle = "0.6"
rayon = "1.12"
regex = "1"
rust-embed = "8"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"
wry = { package = "lb-wry", version = "=0.53.3" }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = "symbols"

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
